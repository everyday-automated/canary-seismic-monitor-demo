<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
  <title id="title">Canary Seismic Monitor public demo architecture</title>
  <desc id="desc">A layered data flow from an IGN CSV snapshot through validation, island classification, Dash callbacks and Plotly visualizations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1019"/><stop offset="1" stop-color="#141a28"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#182235"/><stop offset="1" stop-color="#101725"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffb15c"/><stop offset="1" stop-color="#ff5c45"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ff8a65"/></marker>
    <style>.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#f4f7fb;font-weight:700}.muted{fill:#91a0b5}.node{fill:url(#node);stroke:#30405a;stroke-width:2}.chip{fill:#202c40}.flow{fill:none;stroke:#ff8a65;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="540" rx="24" fill="url(#bg)"/>
  <rect x="45" y="40" width="1410" height="8" rx="4" fill="url(#accent)"/>
  <g class="sans">
    <text x="70" y="100" class="title" font-size="28">Public demo architecture</text>
    <text x="70" y="132" class="muted" font-size="16">A reproducible read-only pipeline built around a curated official IGN snapshot</text>

    <path class="flow" d="M302 287H376"/><path class="flow" d="M612 287H686"/><path class="flow" d="M922 287H996"/><path class="flow" d="M1232 287H1306"/>

    <g transform="translate(70 195)">
      <rect class="node" width="232" height="184" rx="18"/>
      <circle cx="38" cy="38" r="17" fill="#ff775c"/><path d="M30 32h16M30 38h16M30 44h12" stroke="#fff" stroke-width="2"/>
      <text x="28" y="85" class="title" font-size="19">IGN snapshot</text>
      <text x="28" y="112" class="muted" font-size="14">Semicolon-delimited CSV</text>
      <rect x="28" y="134" width="86" height="25" rx="8" class="chip"/><text x="43" y="151" fill="#ffb15c" font-size="12">data/</text>
    </g>
    <g transform="translate(380 195)">
      <rect class="node" width="232" height="184" rx="18"/>
      <circle cx="38" cy="38" r="17" fill="#ff9c5d"/><path d="M29 38l6 6 12-14" fill="none" stroke="#fff" stroke-width="2.5"/>
      <text x="28" y="85" class="title" font-size="19">Data layer</text>
      <text x="28" y="112" class="muted" font-size="14">Validation and sorting</text>
      <rect x="28" y="134" width="160" height="25" rx="8" class="chip"/><text x="41" y="151" fill="#ffb15c" font-size="12">data.py · pandas</text>
    </g>
    <g transform="translate(690 195)">
      <rect class="node" width="232" height="184" rx="18"/>
      <circle cx="38" cy="38" r="17" fill="#ffb15c"/><path d="M38 27v22M27 38h22" stroke="#fff" stroke-width="2"/>
      <text x="28" y="85" class="title" font-size="19">Geo domain</text>
      <text x="28" y="112" class="muted" font-size="14">Nearest-island classifier</text>
      <rect x="28" y="134" width="146" height="25" rx="8" class="chip"/><text x="41" y="151" fill="#ffb15c" font-size="12">ISLAND_CENTERS</text>
    </g>
    <g transform="translate(1000 195)">
      <rect class="node" width="232" height="184" rx="18"/>
      <circle cx="38" cy="38" r="17" fill="#ef7057"/><path d="M28 45l7-8 7 4 8-12" fill="none" stroke="#fff" stroke-width="2.5"/>
      <text x="28" y="85" class="title" font-size="19">Dash service</text>
      <text x="28" y="112" class="muted" font-size="14">Layout and callbacks</text>
      <rect x="28" y="134" width="164" height="25" rx="8" class="chip"/><text x="41" y="151" fill="#ffb15c" font-size="12">dashboard.py</text>
    </g>
    <g transform="translate(1310 195)">
      <rect class="node" width="120" height="184" rx="18"/>
      <circle cx="38" cy="38" r="17" fill="#ff5c45"/><path d="M28 45V35M38 45V28M48 45V32" stroke="#fff" stroke-width="3"/>
      <text x="20" y="85" class="title" font-size="17">Plotly</text>
      <text x="20" y="110" class="muted" font-size="13">Map</text>
      <text x="20" y="130" class="muted" font-size="13">History</text>
      <text x="20" y="150" class="muted" font-size="13">Metrics</text>
    </g>

    <text x="70" y="438" class="title" font-size="16">Runtime boundary</text>
    <text x="70" y="466" class="muted" font-size="14">The browser changes filters. The bundled data remains read-only and deterministic.</text>
    <text x="70" y="505" fill="#ff8a65" font-size="13">Production-only ingestion, Watchdog automation and persistent Railway storage are intentionally excluded.</text>
  </g>
</svg>
