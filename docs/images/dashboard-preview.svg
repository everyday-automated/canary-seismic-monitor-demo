<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
  <title id="title">Canary Seismic Monitor dashboard preview</title>
  <desc id="desc">Dark seismic dashboard with event metrics, a Canary Islands map, recent earthquakes and an activity chart.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="80%" cy="0%" r="85%">
      <stop offset="0" stop-color="#56212e"/>
      <stop offset="0.46" stop-color="#101522"/>
      <stop offset="1" stop-color="#070a10"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb15c"/>
      <stop offset="1" stop-color="#ff4d4d"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff775c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff775c" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#8390a4}.label{fill:#96a3b6;font-size:13px}.panel{fill:#111827;fill-opacity:.92;stroke:#263040}.grid{stroke:#263040;stroke-width:1}.island{fill:#273244;stroke:#45546b;stroke-width:1.5}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:15px}.title{fill:#f4f7fb;font-weight:800}.accent{fill:#ff8a65}
    </style>
  </defs>

  <rect width="1440" height="1050" fill="url(#bgGlow)"/>
  <g class="sans">
    <circle cx="82" cy="65" r="5" fill="#ff614d" filter="url(#glow)"/>
    <text x="98" y="70" fill="#ffb15c" font-size="12" font-weight="800" letter-spacing="2.4">IGN DATA SNAPSHOT · PUBLIC DEMO</text>
    <text x="78" y="135" class="title" font-size="56" letter-spacing="-2.8">Canary Seismic Monitor</text>
    <text x="80" y="169" fill="#99a6b8" font-size="17">Official Canary Islands earthquake data transformed into an interactive monitoring dashboard.</text>

    <g transform="translate(1090 100)">
      <text x="0" y="-12" class="label tiny" letter-spacing="1.2">FILTER BY ISLAND</text>
      <rect width="270" height="48" rx="12" fill="#101826" stroke="#2a374a"/>
      <text x="18" y="30" fill="#f4f7fb" font-size="14">All islands</text>
      <path d="M238 20l6 7 6-7" fill="none" stroke="#96a3b6" stroke-width="2"/>
    </g>

    <g>
      <g transform="translate(80 215)">
        <rect class="panel" width="410" height="105" rx="17"/>
        <rect width="4" height="105" rx="2" fill="url(#accent)"/>
        <text x="24" y="34" class="label">Recorded events</text>
        <text x="24" y="78" class="title" font-size="34">5</text>
      </g>
      <g transform="translate(515 215)">
        <rect class="panel" width="410" height="105" rx="17"/>
        <rect width="4" height="105" rx="2" fill="url(#accent)"/>
        <text x="24" y="34" class="label">Strongest magnitude</text>
        <text x="24" y="78" class="title" font-size="34">M 3.6</text>
      </g>
      <g transform="translate(950 215)">
        <rect class="panel" width="410" height="105" rx="17"/>
        <rect width="4" height="105" rx="2" fill="url(#accent)"/>
        <text x="24" y="34" class="label">Latest event</text>
        <text x="24" y="78" class="title" font-size="34">30.08 · 13:31</text>
      </g>
    </g>

    <g transform="translate(80 345)">
      <rect class="panel" width="830" height="485" rx="20"/>
      <text x="22" y="36" class="title" font-size="17">Activity map</text>
      <g transform="translate(22 55)">
        <rect width="786" height="408" rx="13" fill="#0a111c"/>
        <path class="grid" d="M0 82h786M0 164h786M0 246h786M0 328h786M157 0v408M314 0v408M471 0v408M628 0v408" opacity=".7"/>
        <path d="M98 280c20-14 39-12 55-4s28 10 44 5l11 18c-31 20-75 25-115 2z" class="island"/>
        <path d="M218 230c17-23 39-30 60-20l18 22-17 26-43 4-23-13z" class="island"/>
        <path d="M332 246c18-18 40-17 60-6l-5 26-44 12-24-14z" class="island"/>
        <path d="M430 201c41-26 94-29 132-4l-8 31-70 23-57-18z" class="island"/>
        <path d="M600 220c28-22 69-23 97-3l14 29-35 31-65-9-22-27z" class="island"/>
        <path d="M694 112c10-28 25-47 45-58l14 11-11 68-29 44-23-17z" class="island"/>
        <path d="M739 39c2-17 11-28 26-34l8 14-12 29z" class="island"/>

        <text x="95" y="329" class="muted tiny">El Hierro</text>
        <text x="215" y="290" class="muted tiny">La Palma</text>
        <text x="330" y="305" class="muted tiny">La Gomera</text>
        <text x="452" y="282" class="muted tiny">Tenerife</text>
        <text x="617" y="304" class="muted tiny">Gran Canaria</text>
        <text x="664" y="199" class="muted tiny">Fuerteventura</text>
        <text x="733" y="79" class="muted tiny">Lanzarote</text>

        <circle cx="521" cy="218" r="32" fill="#ff5c45" opacity=".13"/>
        <circle cx="521" cy="218" r="21" fill="none" stroke="#ff5c45" stroke-width="2" opacity=".55"/>
        <circle cx="521" cy="218" r="8" fill="#ff5c45" filter="url(#glow)"/>
        <circle cx="641" cy="242" r="11" fill="#ff9b55"/>
        <circle cx="498" cy="200" r="9" fill="#ff775c"/>
        <circle cx="511" cy="191" r="13" fill="#ff4d4d"/>

        <g transform="translate(18 20)">
          <rect width="168" height="58" rx="10" fill="#111827" stroke="#2b3749"/>
          <text x="14" y="23" class="accent small" font-weight="700">M 3.6 · Tenerife</text>
          <text x="14" y="43" class="muted tiny">26 Aug 2026 · 17:37</text>
        </g>
      </g>
    </g>

    <g transform="translate(930 345)">
      <rect class="panel" width="430" height="485" rx="20"/>
      <text x="22" y="36" class="title" font-size="17">Latest events</text>
      <g transform="translate(20 58)">
        <g>
          <rect width="390" height="73" rx="13" fill="#0c1320" stroke="#35445b"/>
          <text x="14" y="25" class="accent body" font-weight="700">M 2.6</text><text x="270" y="25" class="muted tiny">30.08.2026 · 13:31</text>
          <text x="14" y="47" fill="#f4f7fb" class="small">ATLANTICO-CANARIAS</text><text x="14" y="63" class="muted tiny">Gran Canaria · 28.058, -14.933</text>
        </g>
        <g transform="translate(0 82)">
          <rect width="390" height="73" rx="13" fill="#0c1320" stroke="#29364a"/>
          <text x="14" y="25" class="accent body" font-weight="700">M 2.6</text><text x="270" y="25" class="muted tiny">30.08.2026 · 04:38</text>
          <text x="14" y="47" fill="#f4f7fb" class="small">ATLANTICO-CANARIAS</text><text x="14" y="63" class="muted tiny">Tenerife · 28.816, -16.336</text>
        </g>
        <g transform="translate(0 164)">
          <rect width="390" height="73" rx="13" fill="#0c1320" stroke="#29364a"/>
          <text x="14" y="25" class="accent body" font-weight="700">M 2.8</text><text x="270" y="25" class="muted tiny">26.08.2026 · 17:58</text>
          <text x="14" y="47" fill="#f4f7fb" class="small">ATLANTICO-CANARIAS</text><text x="14" y="63" class="muted tiny">Tenerife · 28.827, -16.302</text>
        </g>
        <g transform="translate(0 246)">
          <rect width="390" height="73" rx="13" fill="#0c1320" stroke="#ff805e"/>
          <text x="14" y="25" class="accent body" font-weight="700">M 3.6</text><text x="270" y="25" class="muted tiny">26.08.2026 · 17:37</text>
          <text x="14" y="47" fill="#f4f7fb" class="small">ATLANTICO-CANARIAS</text><text x="14" y="63" class="muted tiny">Tenerife · 28.770, -16.344</text>
        </g>
        <g transform="translate(0 328)">
          <rect width="390" height="73" rx="13" fill="#0c1320" stroke="#29364a"/>
          <text x="14" y="25" class="accent body" font-weight="700">M 3.0</text><text x="270" y="25" class="muted tiny">26.08.2026 · 16:57</text>
          <text x="14" y="47" fill="#f4f7fb" class="small">ATLANTICO-CANARIAS</text><text x="14" y="63" class="muted tiny">Tenerife · 28.792, -16.325</text>
        </g>
      </g>
    </g>

    <g transform="translate(80 855)">
      <rect class="panel" width="1280" height="145" rx="20"/>
      <text x="22" y="33" class="title" font-size="17">Activity history</text>
      <text x="22" y="53" class="muted tiny">Daily event count and strongest recorded magnitude</text>
      <path d="M70 114h1140M70 86h1140M70 58h1140" class="grid" opacity=".6"/>
      <path d="M165 113V87H230V113M850 113V43H915V113" fill="url(#chartFill)" stroke="#ff775c" stroke-width="2"/>
      <path d="M197 73C420 72 640 64 882 37" fill="none" stroke="#ffd166" stroke-width="4"/>
      <circle cx="197" cy="73" r="5" fill="#ffd166"/><circle cx="882" cy="37" r="5" fill="#ffd166"/>
      <text x="170" y="132" class="muted tiny">26.08</text><text x="854" y="132" class="muted tiny">30.08</text>
    </g>
  </g>
</svg>
