[project]
name = "canary-seismic-monitor-demo"
version = "0.1.0"
description = "Public portfolio demo of an interactive Canary Islands earthquake dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=3.0",
    "pandas>=2.2",
    "plotly>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canary_demo"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
